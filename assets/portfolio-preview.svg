  <text x="88" y="400" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">REYNALDI</text>
  <text x="88" y="462" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">DELPHIANO</text>
  <text x="88" y="516" font-family="Arial, sans-serif" font-size="24" fill="#a6b6ff">Web &amp; Mobile Developer</text>
