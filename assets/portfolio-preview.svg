<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Website Portfolio Reynaldi Delphiano</title>
  <desc id="desc">Preview of Reynaldi Delphiano personal portfolio website.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#263a8d"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#7c5cf0"/>
