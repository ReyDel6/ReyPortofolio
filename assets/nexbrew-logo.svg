<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4E37" />
      <stop offset="100%" stop-color="#4A3324" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB563" />
      <stop offset="100%" stop-color="#C8873A" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="120" height="120" rx="28" fill="url(#bg)" />
  <!-- Border subtle gold -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4" />
  
  <!-- Coffee Cup Outline & Steam -->
  <g transform="translate(30, 26)" stroke="#FFFFFF" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam lines -->
    <path d="M16 4 C14 8, 18 12, 16 16" stroke="url(#gold)" opacity="0.9" />
    <path d="M28 2 C26 7, 30 11, 28 16" stroke="url(#gold)" opacity="0.9" />
    <path d="M40 4 C38 8, 42 12, 40 16" stroke="url(#gold)" opacity="0.9" />
    
    <!-- Cup Body -->
    <path d="M8 22 L52 22 C52 46, 12 46, 8 22 Z" fill="#6F4E37" fill-opacity="0.3" />
    <!-- Cup Handle -->
    <path d="M48 26 C57 26, 57 38, 48 40" />
    <!-- Saucer -->
    <path d="M4 52 L56 52" stroke="url(#gold)" stroke-width="4" />
  </g>
  
  <!-- Brand Text -->
  <text x="60" y="98" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">NEXBREW</text>
  <text x="60" y="110" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="7" fill="#FEB563" letter-spacing="1.5">SPECIALTY ROASTERY</text>
</svg>
